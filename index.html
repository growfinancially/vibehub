<!DOCTYPE html>
<html lang="pt-PT" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>VibeHub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0b0d10;
  --card:#15181d;
  --card2:#1b1f25;
  --text:#f5f5f7;
  --muted:#969ca7;
  --accent:#7c5cff;
  --border:#292e36;
  --danger:#ff5c5c;
  --success:#4ade80
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh
}

button,input,textarea,select{
  font:inherit
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(11,13,16,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border)
}

.nav{
  max-width:1150px;
  height:68px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:10px
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
  margin-right:auto
}

.logo span{
  color:var(--accent)
}

.search{
  width:220px;
  padding:9px 13px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  outline:none
}

.btn{
  border:0;
  border-radius:10px;
  padding:9px 13px;
  background:var(--card2);
  color:white;
  font-weight:750;
  white-space:nowrap;
  cursor:pointer
}

.btn:hover{
  filter:brightness(1.12)
}

.primary{
  background:var(--accent)
}

main{
  max-width:1150px;
  margin:auto;
  padding:32px 18px 70px
}

.hero{
  padding:32px 0 24px
}

.hero h1{
  font-size:42px;
  line-height:1.05;
  letter-spacing:-2px
}

.hero p{
  color:var(--muted);
  font-size:17px;
  line-height:1.45;
  max-width:650px;
  margin-top:12px
}

.tabs{
  display:flex;
  gap:9px;
  margin:18px 0 30px
}

.tab{
  padding:10px 17px;
  border:0;
  border-radius:22px;
  background:var(--card);
  color:var(--muted);
  cursor:pointer
}

.tab.active{
  background:white;
  color:#111
}

.section-title{
  font-size:22px;
  margin-bottom:15px
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden
}

.media{
  height:245px;
  background:#20252c;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden
}

.media img,
.media video{
  width:100%;
  height:100%;
  object-fit:cover
}

.placeholder{
  font-size:56px
}

.badge{
  position:absolute;
  right:12px;
  top:12px;
  background:#08090bda;
  padding:7px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:800
}

.body{
  padding:15px
}

.creator{
  display:flex;
  align-items:center;
  gap:9px
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c5cff,#21d4fd);
  font-weight:900;
  overflow:hidden;
  flex-shrink:0
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.small,.desc{
  color:var(--muted)
}

.small{
  font-size:12px
}

.title{
  font-weight:800;
  margin:12px 0 6px
}

.desc{
  font-size:14px;
  line-height:1.4
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px
}

.actions button{
  flex:1;
  padding:9px;
  border:0;
  border-radius:9px;
  background:var(--card2);
  color:white;
  cursor:pointer
}

.actions button:hover{
  background:#252a32
}

.actions button.liked{
  color:var(--accent);
}

.actions button.commented{
  color:var(--accent);
}

.premium{
  margin-top:13px;
  padding:13px;
  border-radius:10px;
  background:#211b3d;
  border:1px solid #45378a
}

.premium strong{
  display:block;
  margin-bottom:4px
}

.creator-box{
  margin-top:35px;
  padding:22px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--card);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px
}

/* UTILIZADOR */

.user-area{
  display:flex;
  align-items:center;
  gap:8px
}

.user-profile-btn{
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 13px;
  background:var(--card2);
  color:white;
  font-weight:750;
  cursor:pointer
}

.logout-btn{
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 13px;
  background:var(--card2);
  color:white;
  font-weight:750;
  cursor:pointer
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal.show{
  display:flex
}

.modalbox{
  width:min(450px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px
}

.close{
  float:right;
  background:none;
  color:var(--muted);
  font-size:24px;
  border:0;
  cursor:pointer
}

.modalbox h2{
  margin-bottom:12px
}

.modalbox input,
.modalbox textarea,
.modalbox select{
  width:100%;
  margin:7px 0;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#0e1115;
  color:white;
  outline:none
}

.modalbox textarea{
  min-height:85px;
  resize:vertical
}

.modalbox .full{
  width:100%;
  margin-top:8px
}

.message{
  margin-top:10px;
  line-height:1.4
}

.profile-card{
  text-align:center;
  padding:10px 0
}

.profile-avatar{
  width:85px;
  height:85px;
  border-radius:50%;
  margin:5px auto 12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c5cff,#21d4fd);
  font-size:32px;
  font-weight:900;
  overflow:hidden
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.profile-card h2{
  margin-bottom:4px
}

.profile-card p{
  color:var(--muted);
  font-size:14px
}

.profile-buttons{
  display:grid;
  gap:8px;
  margin-top:18px
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:18px 0 4px;
}

.profile-stat{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 6px;
  text-align:center;
}

.profile-stat strong{
  display:block;
  font-size:18px;
  color:var(--text);
}

.profile-stat span{
  display:block;
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
}

.empty{
  grid-column:1/-1;
  padding:30px;
  text-align:center;
  border:1px dashed var(--border);
  border-radius:14px;
  color:var(--muted)
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:30px;
  color:var(--muted)
}

footer{
  text-align:center;
  padding:25px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:13px
}

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .search{
    width:150px
  }

  .hero h1{
    font-size:36px
  }

}

@media(max-width:560px){

  .grid{
    grid-template-columns:1fr
  }

.search{
  display:block;
  width:140px;
  padding:8px 10px;
  font-size:13px
}

  .nav{
    padding:0 14px
  }

  .nav .btn,
  .user-profile-btn,
  .logout-btn{
    padding:8px 10px;
    font-size:14px
  }

  .logo{
    font-size:21px
  }

  .creator-box{
    flex-direction:column;
    align-items:flex-start
  }

.chat-user{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin:6px 0;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  text-align:left;
}

.chat-user:hover{
  background:var(--card2);
}

.chat-user .avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  object-fit:cover;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--accent);
  color:white;
  font-weight:bold;
}
  
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =================================
   CONFIGURAÇÃO SUPABASE
================================= */

const SUPABASE_URL =
  "https://kcgiwqgjyjklguybmtgp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qU22AqdzGgVVHHtyMbSU4g_CAh3-PWS";


let supabaseClient = null;

try {

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  console.log("Supabase conectado!");

} catch(error){

  console.error(
    "Erro ao conectar ao Supabase:",
    error
  );

}


/* =================================
   ESTADO
================================= */

let current = "all";
let currentUser = null;
let posts = [];
  

/* =================================
   CHAT
================================= */

async function openChat(){

  if(!currentUser){
    return;
  }

  const content =
    document.getElementById("modalContent");

  content.innerHTML = `
    <h2>💬 Chat</h2>

    <input
      id="chatSearch"
      class="input"
      placeholder="Pesquisar utilizador..."
      oninput="carregarUtilizadoresChat()"
    >

    <div id="chatUsers">
      <p class="desc">
        A carregar utilizadores...
      </p>
    </div>
  `;

  document
    .getElementById("modal")
    .classList.add("show");

  await carregarUtilizadoresChat();
}


async function carregarUtilizadoresChat(){

  if(!currentUser || !supabaseClient){
    return;
  }

  const search =
    document
      .getElementById("chatSearch")
      ?.value
      ?.trim()
      ?.toLowerCase() || "";

  const result =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url
      `)
      .neq("id", currentUser.id)
      .limit(50);

  if(result.error){

    console.error(
      "Erro ao carregar utilizadores:",
      result.error
    );

    return;
  }

  let users = result.data || [];

  if(search){

    users = users.filter(user => {

      const name =
        (
          user.display_name ||
          user.username ||
          ""
        ).toLowerCase();

      return name.includes(search);
    });
  }

  const container =
    document.getElementById("chatUsers");

  if(!container){
    return;
  }

  if(!users.length){

    container.innerHTML = `
      <p class="desc">
        Nenhum utilizador encontrado.
      </p>
    `;

    return;
  }

  container.innerHTML =
    users.map(user => {

      const name =
        user.display_name ||
        user.username ||
        "Utilizador";

      return `
        <button
          class="chat-user"
          onclick="abrirConversa('${user.id}')"
        >

          ${
            user.avatar_url
            ? `
              <img
                src="${user.avatar_url}"
                class="avatar"
              >
            `
            : `
              <div class="avatar">
                ${escapeHTML(name.charAt(0).toUpperCase())}
              </div>
            `
          }

          <div>
            <strong>
              ${escapeHTML(name)}
            </strong>

            <div class="desc">
              @${escapeHTML(user.username || "")}
            </div>
          </div>

        </button>
      `;

    }).join("");
}


async function abrirConversa(receiverId){

  if(!currentUser){
    return;
  }

  const profileResult =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url
      `)
      .eq("id", receiverId)
      .single();

  if(profileResult.error){

    console.error(
      "Erro ao carregar utilizador:",
      profileResult.error
    );

    return;
  }

  const receiver =
    profileResult.data;

  const receiverName =
    receiver.display_name ||
    receiver.username ||
    "Utilizador";

  const content =
    document.getElementById("modalContent");

  content.innerHTML = `
    <div
      style="
        display:flex;
        align-items:center;
        gap:10px;
        margin-bottom:15px;
      "
    >

      <button
        class="btn"
        onclick="openChat()"
      >
        ←
      </button>

      <div>
        <strong>
          ${escapeHTML(receiverName)}
        </strong>

        <div class="desc">
          @${escapeHTML(receiver.username || "")}
        </div>
      </div>

    </div>

    <div
      id="chatMessages"
      style="
        max-height:350px;
        overflow-y:auto;
        padding:5px;
        margin-bottom:12px;
      "
    >
      A carregar mensagens...
    </div>

    <div
      style="
        display:flex;
        gap:8px;
      "
    >

      <input
        id="messageInput"
        class="input"
        placeholder="Escreve uma mensagem..."
        onkeydown="
          if(event.key === 'Enter'){
            sendMessage('${receiverId}');
          }
        "
      >

      <button
        class="btn primary"
        onclick="sendMessage('${receiverId}')"
      >
        Enviar
      </button>

    </div>
  `;

  await carregarMensagens(receiverId);
}


async function carregarMensagens(receiverId){

  const container =
    document.getElementById("chatMessages");

  if(!container){
    return;
  }

  const result =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
      )
      .order("created_at", {
        ascending:true
      });

  if(result.error){

    console.error(
      "Erro ao carregar mensagens:",
      result.error
    );

    container.innerHTML = `
      <p class="desc">
        Não foi possível carregar as mensagens.
      </p>
    `;

    return;
  }

  const messages =
    result.data || [];

  if(!messages.length){

    container.innerHTML = `
      <p class="desc">
        Ainda não existem mensagens. Sê o primeiro a enviar uma.
      </p>
    `;

    return;
  }

  container.innerHTML =
    messages.map(message => {

      const mine =
        message.sender_id === currentUser.id;

      return `
        <div
          style="
            display:flex;
            justify-content:${mine ? "flex-end" : "flex-start"};
            margin:7px 0;
          "
        >

          <div
            style="
              max-width:75%;
              padding:10px 13px;
              border-radius:14px;
              background:${mine ? "var(--accent)" : "var(--card2)"};
            "
          >
            ${escapeHTML(message.content)}
          </div>

        </div>
      `;

    }).join("");

  container.scrollTop =
    container.scrollHeight;

  await supabaseClient
    .from("messages")
    .update({
      is_read:true
    })
    .eq("sender_id", receiverId)
    .eq("receiver_id", currentUser.id)
    .eq("is_read", false);
  
  await carregarMensagensNaoLidas();
  
}

async function sendMessage(receiverId){

  const input =
    document.getElementById("messageInput");

  if(!input){
    return;
  }

  const content =
    input.value.trim();

  if(!content){
    return;
  }

  const result =
    await supabaseClient
      .from("messages")
      .insert({
        sender_id:currentUser.id,
        receiver_id:receiverId,
        content:content
      });

  if(result.error){

    console.error(
      "Erro ao enviar mensagem:",
      result.error
    );

    alert("Não foi possível enviar a mensagem.");

    return;
  }

  input.value = "";

await carregarMensagens(receiverId);
await carregarMensagensNaoLidas();
  
  
/* =================================
   MENSAGENS NÃO LIDAS
================================= */

async function carregarMensagensNaoLidas(){

  if(!currentUser || !supabaseClient){
    return;
  }

  const result =
    await supabaseClient
      .from("messages")
      .select("id", { count:"exact", head:true })
      .eq("receiver_id", currentUser.id)
      .eq("is_read", false);

  if(result.error){
    console.error(
      "Erro ao contar mensagens:",
      result.error
    );
    return;
  }

  const total =
    result.count || 0;

  const chatBtn =
    document.getElementById("chatBtn");

  if(chatBtn){

    chatBtn.textContent =
      total > 0
        ? `💬 Chat (${total})`
        : "💬 Chat";
   }
  }
  
  /* =================================
   NOTIFICAÇÕES
================================= */

async function carregarNotificacoes(){

  if(!currentUser || !supabaseClient){
    return;
  }

  const result = await supabaseClient
    .from("notifications")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending:false
    })
    .limit(30);

  if(result.error){
    console.error(
      "Erro ao carregar notificações:",
      result.error
    );
    return;
  }

  const notificacoes = result.data || [];

  const naoLidas =
    notificacoes.filter(n => !n.is_read).length;

  const btn =
    document.getElementById("notificationsBtn");

  const count =
    document.getElementById("notificationCount");

  if(btn){
    btn.style.display = "block";
  }

  if(count){
    count.textContent =
      naoLidas > 0 ? `(${naoLidas})` : "";
  }
}


async function openNotifications(){

  if(!currentUser){
    return;
  }

  const result = await supabaseClient
    .from("notifications")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending:false
    })
    .limit(30);

  if(result.error){
    console.error(
      "Erro ao abrir notificações:",
      result.error
    );
    return;
  }

  const notificacoes = result.data || [];

  const content =

/* =================================
   UTILITÁRIOS
================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function getInitial(name){

  if(!name){
    return "?";
  }

  return name
    .trim()
    .charAt(0)
    .toUpperCase();
}

async function carregarEstatisticasPerfil(userId){

  const stats = {
    posts: 0,
    likes: 0,
    comments: 0
  };

  if(!userId || !supabaseClient){
    return stats;
  }

  try{

    // PUBLICAÇÕES
    const postsResult = await supabaseClient
      .from("posts")
      .select("*", {
        count: "exact",
        head: true
      })
      .eq("creator_id", userId);

    if(postsResult.error){
      console.error(
        "Erro ao contar publicações:",
        postsResult.error
      );
    }else{
      stats.posts = postsResult.count || 0;
    }


    // GOSTOS DADOS PELO UTILIZADOR
    const likesResult = await supabaseClient
      .from("likes")
      .select("*", {
        count: "exact",
        head: true
      })
      .eq("user_id", userId);

    if(likesResult.error){
      console.error(
        "Erro ao contar gostos:",
        likesResult.error
      );
    }else{
      stats.likes = likesResult.count || 0;
    }


    // COMENTÁRIOS FEITOS PELO UTILIZADOR
    const commentsResult = await supabaseClient
      .from("comments")
      .select("*", {
        count: "exact",
        head: true
      })
      .eq("user_id", userId);

    if(commentsResult.error){
      console.error(
        "Erro ao contar comentários:",
        commentsResult.error
      );
    }else{
      stats.comments = commentsResult.count || 0;
    }

  }catch(error){

    console.error(
      "Erro ao carregar estatísticas:",
      error
    );

  }

  return stats;
}

async function signup(){

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const username =
    document
      .getElementById("signupUsername")
      .value
      .trim()
      .toLowerCase()
      .replace(/\s+/g,"");

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const msg =
    document.getElementById("signupMsg");


  if(!name || !email || !password){

    msg.textContent =
      "Preenche todos os campos.";

    return;

  }


  if(password.length < 6){

    msg.textContent =
      "A palavra-passe deve ter pelo menos 6 caracteres.";

    return;

  }


  if(!supabaseClient){

    msg.textContent =
      "Supabase não está configurado.";

    return;

  }


  msg.textContent =
    "A criar conta...";


  try{

    const result =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            name:name,
            username:username
          }
        }

      });


    if(result.error){

      msg.textContent =
        result.error.message;

      return;

    }


    const user =
      result.data.user;


    /*
      Se o email confirmation estiver
      desligado, a sessão já existe.
    */

    if(user){

      currentUser = user;

      await carregarPerfil(user);

      mostrarUtilizador(user);

    }


    msg.textContent =
      "Conta criada com sucesso!";

  }catch(error){

    console.error(error);

    msg.textContent =
      "Ocorreu um erro ao criar a conta.";

  }

}

async function carregarPerfil(user){

  if(!supabaseClient || !user){
    return null;
  }


  try{

    const result =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .maybeSingle();


    if(result.error){

      console.error(
        "Erro ao carregar perfil:",
        result.error
      );

      return null;

    }


    /*
      Se ainda não existir perfil,
      tentamos criá-lo.
    */

    if(!result.data){

      const name =
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "Utilizador";

      const username =
        user.user_metadata?.username ||
        user.email?.split("@")[0] ||
        "utilizador";


      const insert =
        await supabaseClient
          .from("profiles")
          .insert({

            id:user.id,
            username:username,
            display_name:name,
            is_creator:false

          })
          .select()
          .single();


      if(insert.error){

        console.error(
          "Erro ao criar perfil:",
          insert.error
        );

        return null;

      }


      currentUser.profile =
        insert.data;

      return insert.data;

    }


    currentUser.profile =
      result.data;

    return result.data;

  }catch(error){

    console.error(error);

    return null;

  }

}

async function createPost(){

  if(!currentUser){

    alert(
      "Precisas de iniciar sessão."
    );

    return;

  }


  const title =
    document
      .getElementById("postTitle")
      .value
      .trim();

  const description =
    document
      .getElementById("postDescription")
      .value
      .trim();

  const type =
    document
      .getElementById("postType")
      .value;

  const fileInput =
    document.getElementById("postFile");

  const msg =
    document.getElementById("postMsg");


  if(!title){

    msg.textContent =
      "Escreve um título.";

    return;

  }


  if(!fileInput.files.length){

    msg.textContent =
      "Escolhe uma imagem ou vídeo.";

    return;

  }


  const file =
    fileInput.files[0];


  /*
    Limite simples de 50 MB
  */

  if(file.size > 50 * 1024 * 1024){

    msg.textContent =
      "O ficheiro é demasiado grande. Máximo: 50 MB.";

    return;

  }


  msg.textContent =
    "A enviar ficheiro...";


  try{

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const safeExtension =
      extension.replace(/[^a-z0-9]/g,"");


    const filePath =
      currentUser.id +
      "/" +
      Date.now() +
      "_" +
      crypto.randomUUID() +
      "." +
      safeExtension;


    /*
      UPLOAD PARA STORAGE
    */

    const upload =
      await supabaseClient
        .storage
        .from("media")
        .upload(
          filePath,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:file.type
          }
        );


    if(upload.error){

      console.error(
        "Erro no upload:",
        upload.error
      );

      msg.textContent =
        "Erro ao enviar o ficheiro: " +
        upload.error.message;

      return;

    }


    msg.textContent =
      "Ficheiro enviado. A guardar publicação...";


    /*
      URL PÚBLICA
    */

    const publicResult =
      supabaseClient
        .storage
        .from("media")
        .getPublicUrl(filePath);


    const mediaUrl =
      publicResult.data.publicUrl;


    /*
      GUARDAR POST
    */

    const insert =
      await supabaseClient
        .from("posts")
        .insert({

          creator_id:currentUser.id,

          title:title,

          description:
            description || null,

          media_url:mediaUrl,

          media_type:
            file.type.startsWith("video/")
            ? "video"
            : "image",

          access_type:type

        })
        .select()
        .single();


    if(insert.error){

      console.error(
        "Erro ao guardar publicação:",
        insert.error
      );

      /*
        Se o post falhar,
        apagamos o ficheiro para
        não deixar lixo no Storage.
      */

      await supabaseClient
        .storage
        .from("media")
        .remove([filePath]);


      msg.textContent =
        "Erro ao guardar publicação: " +
        insert.error.message;

      return;

    }


    msg.textContent =
      "Publicado com sucesso!";


    /*
      Atualizar feed
    */

    await carregarPosts();


    setTimeout(function(){

      closeModal();

    },800);


  }catch(error){

    console.error(error);

    msg.textContent =
      "Ocorreu um erro ao publicar.";

  }

}

    }

  ];

  render();

}


/* =================================
   RENDER FEED
================================= */

function render(){

  const search =
    document.getElementById("search");

  const feed =
    document.getElementById("feed");


  if(!search || !feed){
    return;
  }


  const q =
    search.value
      .toLowerCase()
      .trim();


  const arr =
    posts.filter(function(post){

      const profile =
        post.profiles || {};

      const creator =
        profile.display_name ||
        profile.username ||
        "Criador";


      const matchesType =
        current === "all" ||
        post.access_type === current;


      const matchesSearch =
        creator
          .toLowerCase()
          .includes(q) ||

        (post.title || "")
          .toLowerCase()
          .includes(q);


      return matchesType && matchesSearch;

    });


  if(!arr.length){

    feed.innerHTML = `

      <div class="empty">
        Nenhuma publicação encontrada.
      </div>

    `;

    return;

  }


  feed.innerHTML =
    arr.map(function(post){

      const profile =
        post.profiles || {};


      const creator =
        profile.display_name ||
        profile.username ||
        "Criador";


      const username =
        profile.username ||
        creator.toLowerCase().replace(/\s+/g,"");


      const premium =
        post.access_type === "premium";


      let mediaHTML = "";


      if(post.media_url){

        if(post.media_type === "video"){

          mediaHTML = `

            <video
              src="${escapeHTML(post.media_url)}"
              controls
              preload="metadata"
            ></video>

          `;

        }else{

          mediaHTML = `

            <img
              src="${escapeHTML(post.media_url)}"
              alt="${escapeHTML(post.title)}"
              loading="lazy"
            >

          `;

        }

      }else{

        mediaHTML = `

          <div class="placeholder">
            ${post.media_type === "video" ? "🎬" : "📸"}
          </div>

        `;

      }


      const avatarHTML =
        profile.avatar_url
        ? `
          <img
            src="${escapeHTML(profile.avatar_url)}"
            alt="Avatar"
          >
        `
        : getInitial(creator);


      return `

        <article class="card">

          <div class="media">

            ${mediaHTML}

            ${
              premium
              ? '<span class="badge">🔒 PREMIUM</span>'
              : ''
            }

          </div>


          <div class="body">

            <div class="creator">

              <div class="avatar">
                ${avatarHTML}
              </div>

              <div>

                <b>
                  ${escapeHTML(creator)}
                </b>

                <br>

                <span class="small">
                  @${escapeHTML(username)}
                </span>

              </div>

            </div>


            <div class="title">
              ${escapeHTML(post.title)}
            </div>


            ${
              post.description
              ? `
                <div class="desc">
                  ${escapeHTML(post.description)}
                </div>
              `
              : ""
            }


            ${
              premium
              ? `
                <div class="premium">

                  <strong>
                    Conteúdo exclusivo
                  </strong>

                  <span class="desc">
                    Subscreve para desbloquear.
                  </span>

                </div>
              `
              : ""
            }


            <div class="actions">
            
          <button
            class="${post.likedByMe ? "liked" : ""}"
            onclick="toggleLike(this, '${post.id}')"
          >
            ${post.likedByMe ? "♥ Gostei" : "♡ Gostar"}
            <span class="like-count">
             ${post.likeCount || 0}
             </span>
            </button>
            
            <button
             class="${post.commentedByMe ? "commented" : ""}"
             onclick="${premium ? `postAction('${post.access_type}', '${post.id}', this)` : `showComments('${post.id}', this)`}"
          >
           ${
             premium
             ? "Subscrever"
             : post.commentedByMe
              ? "Comentado"
              : "Comentar"
            }
         
            ${
             !premium && post.commentCount
              ? `<span class="comment-count">${post.commentCount}</span>`
              : ""
            }
           </button>

          ${
           currentUser && post.creator_id === currentUser.id
? `
<button
 class="btn"
 onclick="editPost('${post.id}')"
 style="color:#7c5cff;"
>
  Editar
</button>

<button
 class="btn"
 onclick="deletePost('${post.id}')"
 style="color:#ff5c5c;"
>
  Apagar
</button>
`
: ""
        }

        </div>

          </div>

        </article>

      `;

    }).join("");

}

  userId,
  type,
  message,
  postId,
  actorId
}){

  if(!supabaseClient || !userId || !actorId){
    return;
  }

  // Não criar notificação para nós próprios
  if(userId === actorId){
    return;
  }

  const { error } =
    await supabaseClient
      .from("notifications")
      .insert({
        user_id: userId,
        type: type,
        message: message,
        post_id: postId || null,
        actor_id: actorId
      });

  if(error){
    console.error(
      "Erro ao criar notificação:",
      error
    );
  }
}

async function deletePost(postId){

  if(!currentUser){
    alert("Tens de iniciar sessão.");
    return;
  }

  const confirmacao =
    confirm(
      "Apagar publicação?\n\nEsta ação não pode ser desfeita."
    );

  if(!confirmacao){
    return;
  }

  try{

    const { data, error } =
      await supabaseClient
        .from("posts")
        .delete()
        .eq("id", postId)
        .eq("creator_id", currentUser.id)
        .select();

    if(error){

      console.error(
        "Erro ao apagar publicação:",
        error
      );

      alert(
        "Não foi possível apagar a publicação:\n" +
        error.message
      );

      return;
    }

    if(!data || data.length === 0){

      alert(
        "A publicação não foi apagada. " +
        "Verifica as permissões do Supabase."
      );

      return;
    }

    posts =
      posts.filter(function(post){
        return post.id !== postId;
      });

    render();

    alert("Publicação apagada!");

  }catch(error){

    console.error(error);

    alert(
      "Ocorreu um erro ao apagar a publicação."
    );

  }

  }

  /* =================================
   EDITAR PUBLICAÇÃO
================================= */

async function editPost(postId){

  if(!currentUser){
    alert("Tens de iniciar sessão.");
    return;
  }

  const post =
    posts.find(function(item){
      return item.id === postId;
    });

  if(!post){
    alert("Publicação não encontrada.");
    return;
  }

  if(post.creator_id !== currentUser.id){
    alert("Só podes editar as tuas próprias publicações.");
    return;
  }

  const novoTitulo =
    prompt(
      "Editar título:",
      post.title || ""
    );

  if(novoTitulo === null){
    return;
  }

  const titulo =
    novoTitulo.trim();

  if(!titulo){
    alert("O título não pode ficar vazio.");
    return;
  }

  const novaDescricao =
    prompt(
      "Editar descrição:",
      post.description || ""
    );

  if(novaDescricao === null){
    return;
  }

  const descricao =
    novaDescricao.trim();

  try{

    const result =
      await supabaseClient
        .from("posts")
        .update({
          title: titulo,
          description: descricao || null
        })
        .eq("id", postId)
        .eq("creator_id", currentUser.id)
        .select()
        .single();

    if(result.error){

      console.error(
        "Erro ao editar publicação:",
        result.error
      );

      alert(
        "Não foi possível editar a publicação:\n" +
        result.error.message
      );

      return;
    }

    posts =
      posts.map(function(item){

        if(item.id === postId){

          return {
            ...item,
            title: result.data.title,
            description: result.data.description
          };

        }

        return item;

      });

    render();

    alert("Publicação editada com sucesso!");

  }catch(error){

    console.error(error);

    alert(
      "Ocorreu um erro ao editar a publicação."
    );

  }

  }

function filterPosts(type,el){

  current = type;


  document
    .querySelectorAll(".tab")
    .forEach(function(tab){

      tab.classList.remove("active");

    });


  el.classList.add("active");

  render();

}

  function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
  }

/* =================================
   PESQUISA
================================= */

function searchPosts(){

  const input = document.getElementById("search");

  if(!input) return;

  const query = input.value.trim().toLowerCase();

  const feed = document.getElementById("feed");

  if(!feed) return;

  // Sem pesquisa → mostrar tudo novamente
  if(!query){
    render();
    return;
  }

  const resultados = posts.filter(post => {

    const titulo = String(post.title || "").toLowerCase();
    const descricao = String(post.description || "").toLowerCase();

    const criador =
      String(
        post.creator_name ||
        post.username ||
        post.name ||
        ""
      ).toLowerCase();

    return (
      titulo.includes(query) ||
      descricao.includes(query) ||
      criador.includes(query)
    );

  });

  if(!resultados.length){

    feed.innerHTML = `
      <div class="empty">
         Nenhum resultado encontrado para
        <strong>"${escapeHtml(query)}"</strong>.
      </div>
    `;

    return;
  }

  // Guardar temporariamente os posts atuais
  const postsOriginais = posts;

  posts = resultados;

  render();

  posts = postsOriginais;
  }

async function showMyPosts(){

  closeModal();


  if(!currentUser){
    return;
  }


  const feed =
    document.getElementById("feed");


  feed.innerHTML =
    `<div class="loading">A carregar as tuas publicações...</div>`;


  try{

    const result =
      await supabaseClient
        .from("posts")
        .select(`
          id,
          creator_id,
          title,
          description,
          media_url,
          media_type,
          access_type,
          created_at,
          profiles (
            username,
            display_name,
            avatar_url,
            is_creator
          )
        `)
        .eq(
          "creator_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){

      console.error(result.error);

      feed.innerHTML =
        `<div class="empty">Erro ao carregar as tuas publicações.</div>`;

      return;

    }


    const oldPosts =
      posts;

    posts =
      result.data || [];


    current =
      "all";


    document
      .querySelectorAll(".tab")
      .forEach(function(tab){

        tab.classList.remove("active");

      });


    render();


    /*
      Voltamos a mostrar todos os posts
      quando o utilizador atualizar a página.
    */

    setTimeout(function(){

      posts =
        oldPosts;

    },100);

  }catch(error){

    console.error(error);

    feed.innerHTML =
      `<div class="empty">Ocorreu um erro.</div>`;

  }

}
