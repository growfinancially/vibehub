<!DOCTYPE html>
<html lang="pt-PT" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>VibeHub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0b0d10;
  --card:#15181d;
  --card2:#1b1f25;
  --text:#f5f5f7;
  --muted:#969ca7;
  --accent:#7c5cff;
  --border:#292e36;
  --danger:#ff5c5c;
  --success:#4ade80
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh
}

button,input,textarea,select{
  font:inherit
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(11,13,16,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border)
}

.nav{
  max-width:1150px;
  height:68px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:10px
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
  margin-right:auto
}

.logo span{
  color:var(--accent)
}

.search{
  width:220px;
  padding:9px 13px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  outline:none
}

.btn{
  border:0;
  border-radius:10px;
  padding:9px 13px;
  background:var(--card2);
  color:white;
  font-weight:750;
  white-space:nowrap;
  cursor:pointer
}

.btn:hover{
  filter:brightness(1.12)
}

.primary{
  background:var(--accent)
}

main{
  max-width:1150px;
  margin:auto;
  padding:32px 18px 70px
}

.hero{
  padding:32px 0 24px
}

.hero h1{
  font-size:42px;
  line-height:1.05;
  letter-spacing:-2px
}

.hero p{
  color:var(--muted);
  font-size:17px;
  line-height:1.45;
  max-width:650px;
  margin-top:12px
}

.tabs{
  display:flex;
  gap:9px;
  margin:18px 0 30px
}

.tab{
  padding:10px 17px;
  border:0;
  border-radius:22px;
  background:var(--card);
  color:var(--muted);
  cursor:pointer
}

.tab.active{
  background:white;
  color:#111
}

.section-title{
  font-size:22px;
  margin-bottom:15px
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden
}

.media{
  height:245px;
  background:#20252c;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden
}

.media img,
.media video{
  width:100%;
  height:100%;
  object-fit:cover
}

.placeholder{
  font-size:56px
}

.badge{
  position:absolute;
  right:12px;
  top:12px;
  background:#08090bda;
  padding:7px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:800
}

.body{
  padding:15px
}

.creator{
  display:flex;
  align-items:center;
  gap:9px
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c5cff,#21d4fd);
  font-weight:900;
  overflow:hidden;
  flex-shrink:0
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.small,.desc{
  color:var(--muted)
}

.small{
  font-size:12px
}

.title{
  font-weight:800;
  margin:12px 0 6px
}

.desc{
  font-size:14px;
  line-height:1.4
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px
}

.actions button{
  flex:1;
  padding:9px;
  border:0;
  border-radius:9px;
  background:var(--card2);
  color:white;
  cursor:pointer
}

.actions button:hover{
  background:#252a32
}

.actions button.liked{
  color:var(--accent);
}

.actions button.commented{
  color:var(--accent);
}

.premium{
  margin-top:13px;
  padding:13px;
  border-radius:10px;
  background:#211b3d;
  border:1px solid #45378a
}

.premium strong{
  display:block;
  margin-bottom:4px
}

.creator-box{
  margin-top:35px;
  padding:22px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--card);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px
}

/* UTILIZADOR */

.user-area{
  display:flex;
  align-items:center;
  gap:8px
}

.user-profile-btn{
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 13px;
  background:var(--card2);
  color:white;
  font-weight:750;
  cursor:pointer
}

.logout-btn{
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 13px;
  background:var(--card2);
  color:white;
  font-weight:750;
  cursor:pointer
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal.show{
  display:flex
}

.modalbox{
  width:min(450px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px
}

.close{
  float:right;
  background:none;
  color:var(--muted);
  font-size:24px;
  border:0;
  cursor:pointer
}

.modalbox h2{
  margin-bottom:12px
}

.modalbox input,
.modalbox textarea,
.modalbox select{
  width:100%;
  margin:7px 0;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#0e1115;
  color:white;
  outline:none
}

.modalbox textarea{
  min-height:85px;
  resize:vertical
}

.modalbox .full{
  width:100%;
  margin-top:8px
}

.message{
  margin-top:10px;
  line-height:1.4
}

.profile-card{
  text-align:center;
  padding:10px 0
}

.profile-avatar{
  width:85px;
  height:85px;
  border-radius:50%;
  margin:5px auto 12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c5cff,#21d4fd);
  font-size:32px;
  font-weight:900;
  overflow:hidden
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.profile-card h2{
  margin-bottom:4px
}

.profile-card p{
  color:var(--muted);
  font-size:14px
}

.profile-buttons{
  display:grid;
  gap:8px;
  margin-top:18px
}

.empty{
  grid-column:1/-1;
  padding:30px;
  text-align:center;
  border:1px dashed var(--border);
  border-radius:14px;
  color:var(--muted)
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:30px;
  color:var(--muted)
}

footer{
  text-align:center;
  padding:25px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:13px
}

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .search{
    width:150px
  }

  .hero h1{
    font-size:36px
  }

}

@media(max-width:560px){

  .grid{
    grid-template-columns:1fr
  }

  .search{
    display:none
  }

  .nav{
    padding:0 14px
  }

  .nav .btn,
  .user-profile-btn,
  .logout-btn{
    padding:8px 10px;
    font-size:14px
  }

  .logo{
    font-size:21px
  }

  .creator-box{
    flex-direction:column;
    align-items:flex-start
  }

}
</style>
</head>

<body class="notranslate">

<header>

<nav class="nav">

  <input

</header>


<main>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =================================
   CONFIGURAÇÃO SUPABASE
================================= */

const SUPABASE_URL =
  "https://kcgiwqgjyjklguybmtgp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qU22AqdzGgVVHHtyMbSU4g_CAh3-PWS";


let supabaseClient = null;

try {

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  console.log("Supabase conectado!");

} catch(error){

  console.error(
    "Erro ao conectar ao Supabase:",
    error
  );

}


/* =================================
   ESTADO
================================= */

let current = "all";
let currentUser = null;
let posts = [];


/* =================================
   UTILITÁRIOS
================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function getInitial(name){

  if(!name){
    return "?";
  }

  return name
    .trim()
    .charAt(0)
    .toUpperCase();
}


/* =================================
   MODAIS
================================= */

function openModal(type){

  const modal =
    document.getElementById("modal");

  const content =
    document.getElementById("modalContent");


  /* LOGIN */

  if(type === "login"){

    content.innerHTML = `

      <h2>Entrar</h2>

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Palavra-passe"
      >

      <button
        class="btn primary full"
        onclick="login()"
      >
        Entrar
      </button>

      <p
        id="loginMsg"
        class="small message"
      ></p>

    `;

  }


  /* SIGNUP */

  if(type === "signup"){

    content.innerHTML = `

      <h2>Criar conta</h2>

      <input
        id="signupName"
        placeholder="Nome"
      >

      <input
        id="signupUsername"
        placeholder="Username"
      >

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Palavra-passe"
      >

      <button
        class="btn primary full"
        onclick="signup()"
      >
        Criar conta
      </button>

      <p
        id="signupMsg"
        class="small message"
      ></p>

    `;

  }


  /* CRIADOR */

  if(type === "creator"){

    if(!currentUser){

      content.innerHTML = `

        <h2>Torna-te criador</h2>

        <p class="desc">
          Precisas de iniciar sessão para criar uma publicação.
        </p>

        <button
          class="btn primary full"
          onclick="openModal('login')"
        >
          Entrar
        </button>

      `;

      modal.classList.add("show");
      return;

    }


    content.innerHTML = `

      <h2>Criar publicação</h2>

      <input
        id="postTitle"
        placeholder="Título"
        maxlength="100"
      >

      <textarea
        id="postDescription"
        placeholder="Descrição"
        maxlength="500"
      ></textarea>

      <select id="postType">

        <option value="free">
          Publicação gratuita
        </option>

        <option value="premium">
          Conteúdo Premium
        </option>

      </select>

      <input
        id="postFile"
        type="file"
        accept="image/*,video/*"
      >

      <p class="small">
        Máximo recomendado: 50 MB.
      </p>

      <button
        class="btn primary full"
        onclick="createPost()"
      >
        Publicar
      </button>

      <p
        id="postMsg"
        class="small message"
      ></p>

    `;

  }


  /* PERFIL */

  if(type === "profile"){

    if(!currentUser){
      return;
    }

    const profile =
      currentUser.profile || {};

    const name =
      profile.display_name ||
      currentUser.user_metadata?.name ||
      currentUser.email?.split("@")[0] ||
      "Utilizador";

    const avatar =
      profile.avatar_url || "";

    content.innerHTML = `

      <div class="profile-card">

        <div class="profile-avatar">

          ${
            avatar
            ? `<img src="${escapeHTML(avatar)}" alt="Avatar">`
            : getInitial(name)
          }

        </div>

        <h2>
          ${escapeHTML(name)}
        </h2>

        ${
          profile.username
          ? `<p>@${escapeHTML(profile.username)}</p>`
          : ""
        }

        <p style="margin-top:8px">
          ${escapeHTML(currentUser.email || "")}
        </p>

        ${
          profile.bio
          ? `<p style="margin-top:10px">${escapeHTML(profile.bio)}</p>`
          : ""
        }

        <div class="profile-buttons">

          ${
            profile.is_creator
            ? `
              <button
                class="btn primary"
                onclick="openModal('creator')"
              >
                ➕ Criar publicação
              </button>
            `
            : `
              <button
                class="btn primary"
                onclick="becomeCreator()"
              >
                ⭐ Tornar-me criador
              </button>
            `
          }

          <button
            class="btn"
            onclick="showMyPosts()"
          >
            📁 Minhas publicações
          </button>

        </div>

      </div>

    `;

  }


  modal.classList.add("show");

}


function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}


/* =================================
   CRIAR CONTA
================================= */

async function signup(){

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const username =
    document
      .getElementById("signupUsername")
      .value
      .trim()
      .toLowerCase()
      .replace(/\s+/g,"");

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const msg =
    document.getElementById("signupMsg");


  if(!name || !email || !password){

    msg.textContent =
      "Preenche todos os campos.";

    return;

  }


  if(password.length < 6){

    msg.textContent =
      "A palavra-passe deve ter pelo menos 6 caracteres.";

    return;

  }


  if(!supabaseClient){

    msg.textContent =
      "Supabase não está configurado.";

    return;

  }


  msg.textContent =
    "A criar conta...";


  try{

    const result =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            name:name,
            username:username
          }
        }

      });


    if(result.error){

      msg.textContent =
        result.error.message;

      return;

    }


    const user =
      result.data.user;


    /*
      Se o email confirmation estiver
      desligado, a sessão já existe.
    */

    if(user){

      currentUser = user;

      await carregarPerfil(user);

      mostrarUtilizador(user);

    }


    msg.textContent =
      "Conta criada com sucesso!";

  }catch(error){

    console.error(error);

    msg.textContent =
      "Ocorreu um erro ao criar a conta.";

  }

}


/* =================================
   LOGIN
================================= */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const msg =
    document.getElementById("loginMsg");


  if(!email || !password){

    msg.textContent =
      "Preenche o email e a palavra-passe.";

    return;

  }


  if(!supabaseClient){

    msg.textContent =
      "Supabase não está configurado.";

    return;

  }


  msg.textContent =
    "A entrar...";


  try{

    const result =
      await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

      });


    if(result.error){

      msg.textContent =
        result.error.message;

      return;

    }


    currentUser =
      result.data.user;


    await carregarPerfil(currentUser);

    mostrarUtilizador(currentUser);

    closeModal();

    await carregarPosts();


  }catch(error){

    console.error(error);

    msg.textContent =
      "Ocorreu um erro ao entrar.";

  }

}


/* =================================
   PERFIL DO UTILIZADOR
================================= */

async function carregarPerfil(user){

  if(!supabaseClient || !user){
    return null;
  }


  try{

    const result =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .maybeSingle();


    if(result.error){

      console.error(
        "Erro ao carregar perfil:",
        result.error
      );

      return null;

    }


    /*
      Se ainda não existir perfil,
      tentamos criá-lo.
    */

    if(!result.data){

      const name =
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "Utilizador";

      const username =
        user.user_metadata?.username ||
        user.email?.split("@")[0] ||
        "utilizador";


      const insert =
        await supabaseClient
          .from("profiles")
          .insert({

            id:user.id,
            username:username,
            display_name:name,
            is_creator:false

          })
          .select()
          .single();


      if(insert.error){

        console.error(
          "Erro ao criar perfil:",
          insert.error
        );

        return null;

      }


      currentUser.profile =
        insert.data;

      return insert.data;

    }


    currentUser.profile =
      result.data;

    return result.data;

  }catch(error){

    console.error(error);

    return null;

  }

}


/* =================================
   MOSTRAR UTILIZADOR
================================= */

function mostrarUtilizador(user){

  if(!user){
    return;
  }


  const authButtons =
    document.getElementById("authButtons");

  const userArea =
    document.getElementById("userArea");

  authButtons.style.display =
    "none";

  userArea.style.display =
    "flex";

}


/* =================================
   VERIFICAR SESSÃO
================================= */

async function verificarSessao(){

  if(!supabaseClient){
    return;
  }


  try{

    const result =
      await supabaseClient.auth.getSession();


    if(result.data.session){

      currentUser =
        result.data.session.user;

      await carregarPerfil(currentUser);

      mostrarUtilizador(currentUser);

    }


  }catch(error){

    console.error(
      "Erro ao verificar sessão:",
      error
    );

  }

}


/* =================================
   LOGOUT
================================= */

async function logout(){

  if(supabaseClient){

    try{

      await supabaseClient.auth.signOut();

    }catch(error){

      console.error(error);

    }

  }


  currentUser = null;


  document.getElementById(
    "authButtons"
  ).style.display = "flex";


  document.getElementById(
    "userArea"
  ).style.display = "none";

}


/* =================================
   TORNAR-SE CRIADOR
================================= */

async function becomeCreator(){

  if(!currentUser){
    return;
  }


  try{

    const result =
      await supabaseClient
        .from("profiles")
        .update({
          is_creator:true
        })
        .eq("id",currentUser.id)
        .select()
        .single();


    if(result.error){

      alert(
        "Não foi possível ativar o modo criador: " +
        result.error.message
      );

      return;

    }


    currentUser.profile =
      result.data;


    closeModal();

/* =================================
   CRIAR PUBLICAÇÃO
================================= */

async function createPost(){

  if(!currentUser){

    alert(
      "Precisas de iniciar sessão."
    );

    return;

  }


  const title =
    document
      .getElementById("postTitle")
      .value
      .trim();

  const description =
    document
      .getElementById("postDescription")
      .value
      .trim();

  const type =
    document
      .getElementById("postType")
      .value;

  const fileInput =
    document.getElementById("postFile");

  const msg =
    document.getElementById("postMsg");


  if(!title){

    msg.textContent =
      "Escreve um título.";

    return;

  }


  if(!fileInput.files.length){

    msg.textContent =
      "Escolhe uma imagem ou vídeo.";

    return;

  }


  const file =
    fileInput.files[0];


  /*
    Limite simples de 50 MB
  */

  if(file.size > 50 * 1024 * 1024){

    msg.textContent =
      "O ficheiro é demasiado grande. Máximo: 50 MB.";

    return;

  }


  msg.textContent =
    "A enviar ficheiro...";


  try{

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const safeExtension =
      extension.replace(/[^a-z0-9]/g,"");


    const filePath =
      currentUser.id +
      "/" +
      Date.now() +
      "_" +
      crypto.randomUUID() +
      "." +
      safeExtension;


    /*
      UPLOAD PARA STORAGE
    */

    const upload =
      await supabaseClient
        .storage
        .from("media")
        .upload(
          filePath,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:file.type
          }
        );


    if(upload.error){

      console.error(
        "Erro no upload:",
        upload.error
      );

      msg.textContent =
        "Erro ao enviar o ficheiro: " +
        upload.error.message;

      return;

    }


    msg.textContent =
      "Ficheiro enviado. A guardar publicação...";


    /*
      URL PÚBLICA
    */

    const publicResult =
      supabaseClient
        .storage
        .from("media")
        .getPublicUrl(filePath);


    const mediaUrl =
      publicResult.data.publicUrl;


    /*
      GUARDAR POST
    */

    const insert =
      await supabaseClient
        .from("posts")
        .insert({

          creator_id:currentUser.id,

          title:title,

          description:
            description || null,

          media_url:mediaUrl,

          media_type:
            file.type.startsWith("video/")
            ? "video"
            : "image",

          access_type:type

        })
        .select()
        .single();


    if(insert.error){

      console.error(
        "Erro ao guardar publicação:",
        insert.error
      );

      /*
        Se o post falhar,
        apagamos o ficheiro para
        não deixar lixo no Storage.
      */

      await supabaseClient
        .storage
        .from("media")
        .remove([filePath]);


      msg.textContent =
        "Erro ao guardar publicação: " +
        insert.error.message;

      return;

    }


    msg.textContent =
      "Publicado com sucesso! 🎉";


    /*
      Atualizar feed
    */

    await carregarPosts();


    setTimeout(function(){

      closeModal();

    },800);


  }catch(error){

    console.error(error);

    msg.textContent =
      "Ocorreu um erro ao publicar.";

  }

}


/* =================================
   CARREGAR POSTS DO SUPABASE
================================= */

async function carregarPosts(){

  const feed =
    document.getElementById("feed");


  if(!supabaseClient){

    renderFallback();

    return;

  }


  feed.innerHTML =
    `<div class="loading">A carregar publicações...</div>`;


  try{

    const result =
      await supabaseClient
        .from("posts")
        .select(`
          id,
          creator_id,
          title,
          description,
          media_url,
          media_type,
          access_type,
          created_at,
          profiles (
            username,
            display_name,
            avatar_url,
            is_creator
          )
        `)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){

      console.error(
        "Erro ao carregar posts:",
        result.error
      );

      renderFallback();

      return;

    }


    const userResult =
  await supabaseClient.auth.getUser();

const user =
  userResult.data?.user || null;


const { data: likes, error: likesError } =
  await supabaseClient
    .from("likes")
    .select("post_id,user_id");


if(likesError){

  console.error(
    "Erro ao carregar likes:",
    likesError
  );

}


const likeCounts = {};
const likedByMe = {};


const { data: comments, error: commentsError } =
  await supabaseClient
    .from("comments")
    .select("post_id,user_id");

if(commentsError){

  console.error(
    "Erro ao carregar comentários:",
    commentsError
  );

}

const commentCounts = {};
const commentedByMe = {};

(comments || []).forEach(function(comment){

  commentCounts[comment.post_id] =
    (commentCounts[comment.post_id] || 0) + 1;

  if(user && comment.user_id === user.id){

    commentedByMe[comment.post_id] = true;

  }

});


posts =
  (result.data || []).map(function(post){

    return {

      ...post,

likeCount:
  likeCounts[post.id] || 0,

likedByMe:
  !!likedByMe[post.id],

commentCount:
  commentCounts[post.id] || 0,

commentedByMe:
  !!commentedByMe[post.id]
    };

  });


render();
    
  }catch(error){

    console.error(error);

    renderFallback();

  }

}

/* =================================
   RENDER FEED
================================= */

function render(){

  const search =
    document.getElementById("search");

  const feed =
    document.getElementById("feed");


  if(!search || !feed){
    return;
  }


  const q =
    search.value
      .toLowerCase()
      .trim();


  const arr =
    posts.filter(function(post){

      const profile =
        post.profiles || {};

      const creator =
        profile.display_name ||
        profile.username ||
        "Criador";


      const matchesType =
        current === "all" ||
        post.access_type === current;


      const matchesSearch =
        creator
          .toLowerCase()
          .includes(q) ||

        (post.title || "")
          .toLowerCase()
          .includes(q);


      return matchesType && matchesSearch;

    });


  if(!arr.length){

    feed.innerHTML = `

      <div class="empty">
        Nenhuma publicação encontrada.
      </div>

    `;

    return;

  }


  feed.innerHTML =
    arr.map(function(post){

      const profile =
        post.profiles || {};


      const creator =
        profile.display_name ||
        profile.username ||
        "Criador";


      const username =
        profile.username ||
        creator.toLowerCase().replace(/\s+/g,"");


      const premium =
        post.access_type === "premium";


      let mediaHTML = "";


      if(post.media_url){

        if(post.media_type === "video"){

          mediaHTML = `

            <video
              src="${escapeHTML(post.media_url)}"
              controls
              preload="metadata"
            ></video>

          `;

        }else{

          mediaHTML = `

            <img
              src="${escapeHTML(post.media_url)}"
              alt="${escapeHTML(post.title)}"
              loading="lazy"
            >

          `;

        }

      }else{

        mediaHTML = `

          <div class="placeholder">
            ${post.media_type === "video" ? "🎬" : "📸"}
          </div>

        `;

      }


      const avatarHTML =
        profile.avatar_url
        ? `
          <img
            src="${escapeHTML(profile.avatar_url)}"
            alt="Avatar"
          >
        `
        : getInitial(creator);


      return `

        <article class="card">

          <div class="media">

            ${mediaHTML}

            ${
              premium
              ? '<span class="badge">🔒 PREMIUM</span>'
              : ''
            }

          </div>


          <div class="body">

            <div class="creator">

              <div class="avatar">
                ${avatarHTML}
              </div>

              <div>

                <b>
                  ${escapeHTML(creator)}
                </b>

                <br>

                <span class="small">
                  @${escapeHTML(username)}
                </span>

              </div>

            </div>


            <div class="title">
              ${escapeHTML(post.title)}
            </div>


            ${
              post.description
              ? `
                <div class="desc">
                  ${escapeHTML(post.description)}
                </div>
              `
              : ""
            }


            ${
              premium
              ? `
                <div class="premium">

                  <strong>
                    Conteúdo exclusivo
                  </strong>

                  <span class="desc">
                    Subscreve para desbloquear.
                  </span>

                </div>
              `
              : ""
            }


            <div class="actions">
            
          <button
            class="${post.likedByMe ? "liked" : ""}"
            onclick="toggleLike(this, '${post.id}')"
          >
            ${post.likedByMe ? "♥ Gostei" : "♡ Gostar"}
            <span class="like-count">
             ${post.likeCount || 0}
             </span>
            </button>
            
            <button
             class="${post.commentedByMe ? "commented" : ""}"
             onclick="${premium ? `postAction('${post.access_type}', '${post.id}', this)` : `showComments('${post.id}')`}""
          >
           ${
             premium
             ? "💎 Subscrever"
             : post.commentedByMe
              ? "💬 Comentado"
              : "💬 Comentar"
            }
         
            ${
             !premium && post.commentCount
              ? `<span class="comment-count">${post.commentCount}</span>`
              : ""
            }
           </button>

            </div>

          </div>

        </article>

      `;

    }).join("");

}


/* =================================
   GOSTAR
================================= */

async function toggleLike(button, postId){

  const { data: { user } } =
    await supabaseClient.auth.getUser();

  if(!user){
    alert("Tens de iniciar sessão para gostar.");
    return;
  }

  const { data: existing, error: checkError } =
    await supabaseClient
      .from("likes")
      .select("id")
      .eq("post_id", postId)
      .eq("user_id", user.id)
      .maybeSingle();

  if(checkError){
    console.error(checkError);
    alert("Não foi possível verificar o Like.");
    return;
  }

  if(existing){

    const { error } =
      await supabaseClient
        .from("likes")
        .delete()
        .eq("id", existing.id);

    if(error){
      console.error(error);
      return;
    }

    button.textContent = "♡ Gostar";

  }else{

    const { error } =
      await supabaseClient
        .from("likes")
        .insert({
          post_id: postId,
          user_id: user.id
        });

    if(error){
      console.error(error);
      return;
    }

    button.textContent = "♥ Gostei";
    button.classList.add("liked");
  }
}


/* =================================
   AÇÃO DO POST
================================= */

function postAction(type, postId, button){

  if(type === "premium"){

    if(!currentUser){
      openModal("login");
      return;
    }

    alert(
      "A área de subscrição Premium será ligada ao sistema de pagamentos no próximo passo."
    );

    return;
  }

  if(!currentUser){
    openModal("login");
    return;
  }

  window.activeCommentButton = button;
  window.activeCommentPostId = postId;

  const modalContent = document.querySelector("#modalContent");

  modalContent.innerHTML = `
    <h2>💬 Comentar</h2>

    <textarea
      id="commentText"
      placeholder="Escreve o teu comentário..."
      maxlength="500"
      style="width:100%; min-height:120px; margin:15px 0; padding:12px; border-radius:10px; resize:none;"
    ></textarea>

    <button
      class="btn primary full"
      onclick="sendComment()"
    >
      Publicar comentário
    </button>
  `;

  document.querySelector("#modal").classList.add("show");
}


async function sendComment(){

  const text = document.getElementById("commentText").value.trim();

  if(!text){
    alert("Escreve um comentário primeiro.");
    return;
  }

  if(!currentUser){
    openModal("login");
    return;
  }

  const postId = window.activeCommentPostId;

  const { error } = await supabaseClient
    .from("comments")
    .insert({
      post_id: postId,
      user_id: currentUser.id,
      content: text
    });

  if(error){
    console.error(error);
    alert("Erro do Supabase: " + error.message);
    return;
  }

  if(window.activeCommentButton){
    window.activeCommentButton.classList.add("commented");
    window.activeCommentButton.innerHTML = "💬 Comentado";
  }

  closeModal();

  alert("Comentário publicado!");
  }

async function showComments(postId){

  const { data: comments, error } =
    await supabaseClient
      .from("comments")
      .select("content, created_at, user_id")
      .eq("post_id", postId)
      .order("created_at", { ascending: true });

  if(error){
    console.error(error);
    alert("Não foi possível carregar os comentários.");
    return;
  }

  const modalContent =
    document.querySelector("#modalContent");

  if(!comments || !comments.length){

    modalContent.innerHTML = `
      <h2>💬 Comentários</h2>
      <p class="small">Ainda não existem comentários.</p>
    `;

  }else{

    modalContent.innerHTML = `
      <h2>💬 Comentários</h2>

      <div style="display:flex; flex-direction:column; gap:12px; margin-top:15px;">
        ${comments.map(function(comment){

          return `
            <div style="padding:12px; border-radius:10px; background:#20242b;">
              ${escapeHTML(comment.content)}
            </div>
          `;

        }).join("")}
      </div>
    `;
  }

  document
    .querySelector("#modal")
    .classList.add("show");
  }

      await supabaseClient
        .from("posts")
        .select(`
          id,
          creator_id,
          title,
          description,
          media_url,
          media_type,
          access_type,
          created_at,
          profiles (
            username,
            display_name,
            avatar_url,
            is_creator
          )
        `)
        .eq(
          "creator_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){

      console.error(result.error);

      feed.innerHTML =
        `<div class="empty">Erro ao carregar as tuas publicações.</div>`;

      return;

    }


    const oldPosts =
      posts;

    posts =
      result.data || [];


    current =
      "all";


    document
      .querySelectorAll(".tab")
      .forEach(function(tab){

        tab.classList.remove("active");

      });


    render();


    /*
      Voltamos a mostrar todos os posts
      quando o utilizador atualizar a página.
    */

    setTimeout(function(){

      posts =
        oldPosts;

    },100);

  }catch(error){

    console.error(error);

    feed.innerHTML =
      `<div class="empty">Ocorreu um erro.</div>`;

  }

}
