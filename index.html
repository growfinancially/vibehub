<!DOCTYPE html>
<html lang="pt-PT" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>VibeHub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0b0d10;
  --card:#15181d;
  --card2:#1b1f25;
  --text:#f5f5f7;
  --muted:#969ca7;
  --accent:#7c5cff;
  --border:#292e36
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text)
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(11,13,16,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border)
}

.nav{
  max-width:1150px;
  height:68px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:10px
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
  margin-right:auto
}

.logo span{
  color:var(--accent)
}

.search{
  width:220px;
  padding:9px 13px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  outline:none
}

.btn{
  border:0;
  border-radius:10px;
  padding:9px 13px;
  background:var(--card2);
  color:white;
  font-weight:750;
  white-space:nowrap;
  cursor:pointer
}

.primary{
  background:var(--accent)
}

main{
  max-width:1150px;
  margin:auto;
  padding:32px 18px 70px
}

.hero{
  padding:32px 0 24px
}

.hero h1{
  font-size:42px;
  line-height:1.05;
  letter-spacing:-2px
}

.hero p{
  color:var(--muted);
  font-size:17px;
  line-height:1.45;
  max-width:650px;
  margin-top:12px
}

.tabs{
  display:flex;
  gap:9px;
  margin:18px 0 30px
}

.tab{
  padding:10px 17px;
  border:0;
  border-radius:22px;
  background:var(--card);
  color:var(--muted);
  cursor:pointer
}

.tab.active{
  background:white;
  color:#111
}

.section-title{
  font-size:22px;
  margin-bottom:15px
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden
}

.media{
  height:245px;
  background:#20252c;
  display:grid;
  place-items:center;
  position:relative
}

.placeholder{
  font-size:56px
}

.badge{
  position:absolute;
  right:12px;
  top:12px;
  background:#08090bda;
  padding:7px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:800
}

.body{
  padding:15px
}

.creator{
  display:flex;
  align-items:center;
  gap:9px
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c5cff,#21d4fd);
  font-weight:900
}

.small,.desc{
  color:var(--muted)
}

.small{
  font-size:12px
}

.title{
  font-weight:800;
  margin:12px 0 6px
}

.desc{
  font-size:14px;
  line-height:1.4
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px
}

.actions button{
  flex:1;
  padding:9px;
  border:0;
  border-radius:9px;
  background:var(--card2);
  color:white;
  cursor:pointer
}

.premium{
  margin-top:13px;
  padding:13px;
  border-radius:10px;
  background:#211b3d;
  border:1px solid #45378a
}

.premium strong{
  display:block;
  margin-bottom:4px
}

.creator-box{
  margin-top:35px;
  padding:22px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--card);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px
}

/* ÁREA DO UTILIZADOR */

.user-area{
  display:flex;
  align-items:center;
  gap:10px
}

.user-name{
  color:white;
  font-weight:700;
  white-space:nowrap
}

.logout-btn{
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 13px;
  background:var(--card2);
  color:white;
  font-weight:750;
  cursor:pointer
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal.show{
  display:flex
}

.modalbox{
  width:min(450px,100%);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px
}

.close{
  float:right;
  background:none;
  color:var(--muted);
  font-size:24px;
  border:0;
  cursor:pointer
}

.modalbox input,
.modalbox textarea,
.modalbox select{
  width:100%;
  margin:7px 0;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#0e1115;
  color:white
}

.modalbox textarea{
  min-height:85px
}

.modalbox .full{
  width:100%;
  margin-top:8px
}

footer{
  text-align:center;
  padding:25px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:13px
}

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .search{
    width:150px
  }

  .hero h1{
    font-size:36px
  }

}

@media(max-width:560px){

  .grid{
    grid-template-columns:1fr
  }

  .search{
    display:none
  }

  .nav{
    padding:0 14px
  }

  .nav .btn{
    padding:8px 10px;
    font-size:14px
  }

  .logo{
    font-size:21px
  }

  .creator-box{
    flex-direction:column;
    align-items:flex-start
  }

  .user-name{
    display:none
  }

}
</style>
</head>


<body class="notranslate">

<header>

<nav class="nav">

  <div class="logo">
    Vibe<span>Hub</span>
  </div>

  <input
    id="search"
    class="search"
    placeholder="Pesquisar criadores..."
  >

  <!-- BOTÕES ANTES DO LOGIN -->

  <div id="authButtons">

    <button
      class="btn"
      onclick="openModal('login')"
    >
      Entrar
    </button>

    <button
      class="btn primary"
      onclick="openModal('signup')"
    >
      Criar conta
    </button>

  </div>


  <!-- ÁREA DE UTILIZADOR -->

  <div
    id="userArea"
    class="user-area"
    style="display:none"
  >

    <span
      id="userName"
      class="user-name"
    ></span>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Sair
    </button>

  </div>

</nav>

</header>


<main>

<section class="hero">

  <h1>
    Descobre. Cria.<br>
    Partilha.
  </h1>

  <p>
    Uma plataforma para criadores publicarem fotos e vídeos
    e oferecerem conteúdo exclusivo aos seus seguidores.
  </p>

</section>


<div class="tabs">

  <button
    class="tab active"
    onclick="filterPosts('all',this)"
  >
    Para ti
  </button>

  <button
    class="tab"
    onclick="filterPosts('free',this)"
  >
    Grátis
  </button>

  <button
    class="tab"
    onclick="filterPosts('premium',this)"
  >
    💎 Premium
  </button>

</div>


<h2 class="section-title">
  Publicações recentes
</h2>

<section
  id="feed"
  class="grid"
></section>


<div class="creator-box">

  <div>

    <h3>
      Torna-te criador
    </h3>

    <p
      class="desc"
      style="margin-top:5px"
    >
      Publica conteúdo e cria uma área exclusiva
      para os teus seguidores.
    </p>

  </div>

  <button
    class="btn primary"
    onclick="openModal('creator')"
  >
    Começar
  </button>

</div>

</main>


<footer>
VibeHub © 2026 · Plataforma de criadores
</footer>


<!-- MODAL -->

<div
  id="modal"
  class="modal"
  onclick="if(event.target===this)closeModal()"
>

  <div class="modalbox">

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =================================
   CONFIGURAÇÃO SUPABASE
================================= */

const SUPABASE_URL =
  "https://kcgiwqgjyjklguybmtgp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qU22AqdzGgVVHHtyMbSU4g_CAh3-PWS";


let supabaseClient;

try {
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  console.log("Supabase conectado!");

} catch (error) {
  console.error("Erro ao conectar ao Supabase:", error);
}

}catch(error){

  console.error(
    "Erro ao iniciar Supabase:",
    error
  );

}


/* =================================
   PUBLICAÇÕES
================================= */

const posts = [

  [
    "Mia Studio",
    "M",
    "Novo ensaio criativo",
    "Fotografia e lifestyle em ambiente urbano.",
    "free",
    "📸"
  ],

  [
    "Leo Visuals",
    "L",
    "Behind the scenes",
    "Bastidores exclusivos do meu novo projeto.",
    "premium",
    "🎬"
  ],

  [
    "Ana Creates",
    "A",
    "Diário de viagem",
    "Momentos e vídeos da minha última viagem.",
    "free",
    "🌍"
  ],

  [
    "Kai Motion",
    "K",
    "Vídeo exclusivo",
    "Novo conteúdo para a comunidade Premium.",
    "premium",
    "🎥"
  ],

  [
    "Studio 24",
    "S",
    "Sessão de fotos",
    "Uma nova coleção de fotografias.",
    "free",
    "✨"
  ],

  [
    "Noah Films",
    "N",
    "Projeto secreto",
    "Acesso antecipado para subscritores.",
    "premium",
    "🔒"
  ]

];


let current = "all";


/* =================================
   RENDERIZAR FEED
================================= */

function render(){

  const search =
    document.getElementById("search");

  const feed =
    document.getElementById("feed");

  if(!search || !feed) return;


  const q =
    search.value.toLowerCase();


  const arr =
    posts.filter(function(p){

      return(
        (current === "all" || p[4] === current) &&
        p[0].toLowerCase().includes(q)
      );

    });


  if(!arr.length){

    feed.innerHTML =
      "<p class='desc'>Nenhuma publicação encontrada.</p>";

    return;

  }


  feed.innerHTML =
    arr.map(function(p){

      const premium =
        p[4] === "premium";


      return `

        <article class="card">

          <div class="media">

            <div class="placeholder">
              ${p[5]}
            </div>

            ${
              premium
              ? '<span class="badge">🔒 PREMIUM</span>'
              : ''
            }

          </div>


          <div class="body">

            <div class="creator">

              <div class="avatar">
                ${p[1]}
              </div>

              <div>

                <b>
                  ${p[0]}
                </b>

                <br>

                <span class="small">
                  @${p[0].toLowerCase().replaceAll(" ","")}
                </span>

              </div>

            </div>


            <div class="title">
              ${p[2]}
            </div>


            <div class="desc">
              ${p[3]}
            </div>


            ${
              premium
              ? `
                <div class="premium">

                  <strong>
                    Conteúdo exclusivo
                  </strong>

                  <span class="desc">
                    Subscreve para desbloquear.
                  </span>

                </div>
              `
              : ''
            }


            <div class="actions">

              <button
                onclick="toggleLike(this)"
              >
                ♡ Gostar
              </button>

              <button
                onclick="openModal('signup')"
              >
                ${
                  premium
                  ? "💎 Subscrever"
                  : "💬 Comentar"
                }
              </button>

            </div>

          </div>

        </article>

      `;

    }).join("");

}


/* =================================
   GOSTAR
================================= */

function toggleLike(button){

  if(
    button.textContent.includes("Gostei")
  ){

    button.textContent =
      "♡ Gostar";

  }else{

    button.textContent =
      "♥ Gostei";

  }

}


/* =================================
   FILTROS
================================= */

function filterPosts(type,el){

  current = type;


  document
    .querySelectorAll(".tab")
    .forEach(function(tab){

      tab.classList.remove("active");

    });


  el.classList.add("active");

  render();

}


/* =================================
   PESQUISA
================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );


/* =================================
   MODAIS
================================= */

function openModal(type){

  const content =
    document.getElementById("modalContent");


  /* LOGIN */

  if(type === "login"){

    content.innerHTML = `

      <h2>Entrar</h2>

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Palavra-passe"
      >

      <button
        class="btn primary full"
        onclick="login()"
      >
        Entrar
      </button>

      <p
        id="loginMsg"
        class="small"
        style="margin-top:10px"
      ></p>

    `;

  }


  /* CRIAR CONTA */

  if(type === "signup"){

    content.innerHTML = `

      <h2>Criar conta</h2>

      <input
        id="signupName"
        placeholder="Nome"
      >

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Palavra-passe"
      >

      <button
        class="btn primary full"
        onclick="signup()"
      >
        Criar conta
      </button>

      <p
        id="signupMsg"
        class="small"
        style="margin-top:10px"
      ></p>

    `;

  }


  /* CRIAR PUBLICAÇÃO */

  if(type === "creator"){

    content.innerHTML = `

      <h2>Criar publicação</h2>

      <input
        id="postTitle"
        placeholder="Título"
      >

      <textarea
        id="postDescription"
        placeholder="Descrição"
      ></textarea>

      <select id="postType">

        <option>
          Publicação gratuita
        </option>

        <option>
          Conteúdo Premium
        </option>

      </select>

      <input
        id="postFile"
        type="file"
        accept="image/*,video/*"
      >

      <button
        class="btn primary full"
        onclick="createPost()"
      >
        Publicar
      </button>

    `;

  }


  document
    .getElementById("modal")
    .classList.add("show");

}


/* =================================
   CRIAR CONTA
================================= */

async function signup(){

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const msg =
    document.getElementById("signupMsg");


  if(!name || !email || !password){

    msg.textContent =
      "Preenche todos os campos.";

    return;

  }


  if(password.length < 6){

    msg.textContent =
      "A palavra-passe deve ter pelo menos 6 caracteres.";

    return;

  }


  if(!supabaseClient){

    msg.textContent =
      "Supabase não está configurado.";

    return;

  }


  msg.textContent =
    "A criar conta...";


  try{

    const result =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            name:name
          }
        }

      });


    if(result.error){

      msg.textContent =
        result.error.message;

      return;

    }


    msg.textContent =
      "Conta criada! Verifica o teu email.";

  }catch(error){

    console.error(error);

    msg.textContent =
      "Ocorreu um erro ao criar a conta.";

  }

}


/* =================================
   LOGIN
================================= */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const msg =
    document.getElementById("loginMsg");


  if(!email || !password){

    msg.textContent =
      "Preenche o email e a palavra-passe.";

    return;

  }


  if(!supabaseClient){

    msg.textContent =
      "Supabase não está configurado.";

    return;

  }


  msg.textContent =
    "A entrar...";


  try{

    const result =
      await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

      });


    if(result.error){

      msg.textContent =
        result.error.message;

      return;

    }


    mostrarUtilizador(
      result.data.user
    );


    closeModal();


  }catch(error){

    console.error(error);

    msg.textContent =
      "Ocorreu um erro ao entrar.";

  }

}


/* =================================
   MOSTRAR UTILIZADOR
================================= */

function mostrarUtilizador(user){

  if(!user) return;


  const authButtons =
    document.getElementById("authButtons");

  const userArea =
    document.getElementById("userArea");

  const userName =
    document.getElementById("userName");


  const nome =
    user.user_metadata?.name ||
    user.email.split("@")[0];


  userName.textContent =
    "Olá, " + nome;


  authButtons.style.display =
    "none";

  userArea.style.display =
    "flex";

}


/* =================================
   VERIFICAR SESSÃO
================================= */

async function verificarSessao(){

  if(!supabaseClient) return;


  try{

    const result =
      await supabaseClient.auth.getSession();


    if(result.data.session){

      mostrarUtilizador(
        result.data.session.user
      );

    }

  }catch(error){

    console.error(
      "Erro ao verificar sessão:",
      error
    );

  }

}


/* =================================
   SAIR
================================= */

async function logout(){

  if(!supabaseClient) return;


  try{

    await supabaseClient.auth.signOut();

  }catch(error){

    console.error(error);

  }


  document.getElementById(
    "authButtons"
  ).style.display = "flex";


  document.getElementById(
    "userArea"
  ).style.display = "none";

}


/* =================================
   CRIAR PUBLICAÇÃO
================================= */

function createPost(){

  const title =
    document
      .getElementById("postTitle")
      .value
      .trim();

  const description =
    document
      .getElementById("postDescription")
      .value
      .trim();


  if(!title || !description){

    alert(
      "Preenche o título e a descrição."
    );

    return;

  }


  alert(
    "Publicação preparada! A ligação ao Storage e à base de dados será adicionada no próximo passo."
  );

}


/* =================================
   FECHAR MODAL
================================= */

function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}


/* =================================
   INICIAR
================================= */

verificarSessao();

render();

</script>

</body>
  </html>
